spring.application.name=bck-ms-a
server.port=8080

# Supabase (PostgreSQL) — requerido via variables de entorno
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET:nexus-dev-secret-key-minimo-32-caracteres-cambiar-en-prod}
app.jwt.expiration-ms=86400000

app.device.pairing-code-ttl-minutes=5
app.device.token-expiration-days=30
